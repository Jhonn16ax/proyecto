<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Runner - Proyecto 1</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#cfeeff}#app{min-height:100vh;background:linear-gradient(#9fe7ff 0 58%,#8bd35b 58%);padding:18px;color:#123}.wrap{max-width:1050px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}.title{font-size:28px;font-weight:900}.hud{display:flex;gap:8px;flex-wrap:wrap}.pill,button{border:0;border-radius:12px;padding:9px 13px;font-weight:800;background:white;box-shadow:0 3px 0 #0002}.game{position:relative;height:500px;overflow:hidden;border-radius:20px;border:4px solid #123;background:linear-gradient(#8edfff 0 65%,#70bd4d 65%);box-shadow:0 12px 30px #0002}.sun{position:absolute;right:55px;top:35px;width:70px;height:70px;border-radius:50%;background:#ffd85a}.cloud{position:absolute;width:150px;height:42px;border-radius:50px;background:#fff;top:75px;left:15%;opacity:.85}.cloud:after{content:'';position:absolute;width:65px;height:65px;border-radius:50%;background:#fff;left:38px;top:-28px}.mount{position:absolute;bottom:35%;width:0;height:0;border-left:130px solid transparent;border-right:130px solid transparent;border-bottom:180px solid #65a7a1;opacity:.7}.m1{left:5%}.m2{left:34%;transform:scale(1.3)}.m3{left:68%;transform:scale(.9)}.ground{position:absolute;left:0;right:0;bottom:0;height:35%;background:repeating-linear-gradient(110deg,#75c653 0 12px,#6ab74b 12px 22px)}.player{position:absolute;left:105px;bottom:100px;width:92px;height:128px;z-index:5;filter:drop-shadow(0 5px 2px #0004)}.head{position:absolute;left:22px;top:0;width:50px;height:50px;border-radius:48% 52% 45% 50%;background:#78b7ff;border:3px solid #14213d;z-index:4}.head:before{content:'';position:absolute;left:7px;top:11px;width:10px;height:15px;border-radius:50%;background:white;border:2px solid #14213d;box-shadow:21px 0 0 -2px white,21px 0 0 0 #14213d}.head:after{content:'';position:absolute;left:11px;top:-10px;width:35px;height:24px;background:#2563eb;clip-path:polygon(0 80%,12% 0,30% 62%,48% 0,67% 65%,87% 8%,100% 82%,70% 72%,48% 84%,24% 70%);border:2px solid #14213d}.body{position:absolute;left:25px;top:43px;width:45px;height:48px;background:#2563eb;border:3px solid #14213d;border-radius:48% 48% 38% 38%;z-index:3}.body:before{content:'';position:absolute;left:7px;top:13px;width:28px;height:18px;background:#f7d8a8;border-radius:50% 50% 45% 45%;border:2px solid #14213d}.body:after{content:'';position:absolute;left:11px;top:7px;width:22px;height:7px;background:#fff;border-radius:50%;opacity:.9}.arm{position:absolute;width:16px;height:42px;background:#78b7ff;border:3px solid #14213d;border-radius:14px;top:48px;z-index:2}.a1{left:10px;transform:rotate(55deg)}.a2{right:8px;transform:rotate(-55deg)}.a1:after,.a2:after{content:'';position:absolute;bottom:-8px;left:-4px;width:22px;height:16px;background:white;border:3px solid #14213d;border-radius:50%}.leg{position:absolute;width:18px;height:43px;background:#2563eb;border:3px solid #14213d;border-radius:12px;bottom:5px;z-index:1}.l1{left:24px;transform:rotate(22deg)}.l2{right:22px;transform:rotate(-22deg)}.l1:after,.l2:after{content:'';position:absolute;left:-10px;bottom:-10px;width:39px;height:18px;background:#e53935;border:3px solid #14213d;border-radius:60% 45% 45% 60%;box-shadow:inset 0 4px 0 #fff}.running .l1{animation:runL1 .16s infinite alternate}.running .l2{animation:runL2 .16s infinite alternate}.running .a1{animation:runA1 .16s infinite alternate}.running .a2{animation:runA2 .16s infinite alternate}@keyframes runL1{to{transform:rotate(-28deg) translateY(-5px)}}@keyframes runL2{to{transform:rotate(28deg) translateY(-5px)}}@keyframes runA1{to{transform:rotate(25deg)}}@keyframes runA2{to{transform:rotate(-25deg)}}.ring{position:absolute;bottom:145px;width:30px;height:30px;border:7px solid #ffd33d;border-radius:50%;box-shadow:inset 0 0 0 3px #d99d00;z-index:4}.ob{position:absolute;bottom:105px;width:42px;height:55px;background:#8b5a35;border:4px solid #51351f;border-radius:12px 12px 5px 5px;z-index:4}.ob:before{content:'';position:absolute;left:7px;top:-16px;width:20px;height:20px;background:#8b5a35;border:4px solid #51351f;border-radius:50%}.msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}.msg span{background:#ffffffdc;padding:12px 18px;border-radius:14px;font-weight:900}.controls{display:flex;justify-content:center;gap:10px;margin-top:12px;flex-wrap:wrap}button{cursor:pointer;background:#123;color:white}button:hover{transform:translateY(-1px)}.hint{text-align:center;margin-top:9px;font-size:14px;font-weight:700}.selectors{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:12px 0}.selectBox{background:white;border-radius:12px;padding:9px 12px;font-weight:800;box-shadow:0 3px 0 #0002}.selectBox select{border:2px solid #123;border-radius:8px;padding:5px;font-weight:700;margin-left:5px}.game.sunset{background:linear-gradient(#ff9a76 0 65%,#d8794c 65%)}.game.night{background:linear-gradient(#172554 0 65%,#334155 65%)}.game.forest{background:linear-gradient(#b7edff 0 65%,#24733b 65%)}.game.sunset .sun{background:#ffdd70}.game.night .sun{background:#e8eefc;box-shadow:0 0 0 5px #ffffff22}.game.forest .mount{border-bottom-color:#397a45}.player.blue .body{background:#2563eb}.player.red .body{background:#ef4444}.player.green .body{background:#22c55e}.player.gold .body{background:#f59e0b}.player.red .head{background:#ffd0ad}.player.green .head{background:#b8f0bd}.player.gold .head{background:#ffe0a3}.characterCard{min-width:150px;text-align:center}.startScreen{position:absolute;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;background:#0006}.startPanel{background:#fff;border:4px solid #123;border-radius:20px;padding:24px;text-align:center;box-shadow:0 10px 30px #0004}.startPanel h2{margin:0 0 8px;font-size:30px}.startPanel p{margin:6px 0 14px;font-weight:700}.startPanel button{font-size:18px;padding:12px 22px}.player.sonic .body{background:#2563eb}.player.blaze .body{background:#ef4444}.player.vector .body{background:#22c55e}.player.tails .body{background:#f59e0b}.player.sonic .leg{background:#ef4444}.player.blaze .leg{background:#7f1d1d}.player.vector .leg{background:#166534}.player.tails .leg{background:#92400e}
</style></head><body><main id="app"><div class="wrap"><div class="top"><div class="title">🏃 Runner</div><div class="hud"><div class="pill">💍 Anillos: <b id="rings">0</b></div><div class="pill">⭐ Puntos: <b id="score">0</b></div><div class="pill">🏆 Mejor: <b id="best">0</b></div></div></div><div class="selectors"><label class="selectBox">🌎 Escenario <select id="scene"><option value="day">Día</option><option value="sunset">Atardecer</option><option value="night">Noche</option><option value="forest">Bosque</option></select></label><label class="selectBox">🧑 Personaje <select id="character"><option value="sonic">⚡ Sonic Azul</option><option value="blaze">🔥 Blaze Roja</option><option value="vector">💚 Vector Verde</option><option value="tails">⭐ Tails Dorado</option></select></label></div><div class="game" id="game"><div class="sun"></div><div class="cloud"></div><div class="mount m1"></div><div class="mount m2"></div><div class="mount m3"></div><div class="ground"></div><div class="player" id="player"><div class="characterAura"></div><div class="head"></div><div class="body"></div><div class="arm a1"></div><div class="arm a2"></div><div class="leg l1"></div><div class="leg l2"></div></div><div class="msg" id="msg"><span>Presiona EMPEZAR</span></div><div class="startScreen" id="startScreen"><div class="startPanel"><h2>🏃 Runner</h2><p>Elige tu personaje y escenario</p><div style="font-size:46px;margin:8px">⚡ 🔥 💚 ⭐</div><p>🖱️ Haz clic aquí para comenzar</p><p>⌨️ o presiona ENTER</p></div></div></div><div class="controls"><button id="start">▶ Empezar</button><button id="jump">⬆ Saltar</button><button id="reset">↻ Reiniciar</button></div><div class="hint">Haz clic en SALTAR o toca el escenario para saltar. También puedes usar ESPACIO o ↑. El muñeco avanza hacia la derecha.</div></div></main><script>
const game=document.getElementById('game'),p=document.getElementById('player'),msg=document.getElementById('msg'),startScreen=document.getElementById('startScreen'),ringsEl=document.getElementById('rings'),scoreEl=document.getElementById('score'),bestEl=document.getElementById('best'),sceneEl=document.getElementById('scene'),characterEl=document.getElementById('character');let run=false,y=0,vy=0,score=0,bestScore=0,rings=0,last=0,items=[];function jump(){if(!run)return;if(y===0){vy=820}}function reset(){run=false;startScreen.style.display='flex';y=0;vy=0;score=0;rings=0;items.forEach(x=>x.el.remove());items=[];p.style.bottom='112px';p.classList.remove('running');ringsEl.textContent=0;scoreEl.textContent=0;msg.style.display='flex';msg.innerHTML='<span>Presiona EMPEZAR</span>'}function start(){if(run)return;startScreen.style.display='none';run=true;p.classList.add('running');msg.style.display='none';last=performance.now();requestAnimationFrame(loop)}function add(type){const el=document.createElement('div');el.className=type==='ring'?'ring':'ob';el.style.left=(game.clientWidth+30)+'px';game.appendChild(el);items.push({el,type,x:game.clientWidth+30,done:false})}function loop(t){if(!run)return;let dt=Math.min((t-last)/1000,.04);last=t;score+=dt*10;scoreEl.textContent=Math.floor(score);if(score>bestScore){bestScore=score;bestEl.textContent=Math.floor(bestScore)}vy-=1900*dt;y+=vy*dt;if(y<0){y=0;vy=0}p.style.bottom=(112+y)+'px';if(Math.random()<dt*.7)add('ring');if(Math.random()<dt*.38)add('ob');for(const o of items){o.x-=360*dt;o.el.style.left=o.x+'px';const px=120, py=112+y;const hit=o.x<px+55&&o.x+40>px&&((o.type==='ob'&&py<160)||(o.type==='ring'&&Math.abs((py+35)-(145))<65));if(hit&&!o.done){o.done=true;if(o.type==='ring'){rings++;ringsEl.textContent=rings;o.el.remove()}else{run=false;p.classList.remove('running');y=0;vy=0;score=0;rings=0;ringsEl.textContent=0;scoreEl.textContent=0;msg.style.display='flex';msg.innerHTML='<span>💥 Chocaste. ¡Se reinició la partida!</span>';items.forEach(z=>z.el.remove());items=[];return}}}items=items.filter(o=>o.x>-70&&o.el.isConnected);requestAnimationFrame(loop)}sceneEl.onchange=()=>{game.classList.remove('sunset','night','forest');if(sceneEl.value!=='day')game.classList.add(sceneEl.value)};characterEl.onchange=()=>{p.classList.remove('sonic','blaze','vector','tails');p.classList.add(characterEl.value)};document.getElementById('start').onclick=start;startScreen.addEventListener('click',start);document.getElementById('jump').onclick=jump;document.getElementById('reset').onclick=reset;game.addEventListener('pointerdown',e=>{if(e.target===game||e.target.classList.contains('ground'))jump()});document.addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='ArrowUp'){e.preventDefault();jump()}if(e.code==='Enter'){e.preventDefault();start()}});p.classList.add('sonic');reset();
</script></body></html>
