<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Runner - Proyecto 1</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#cfeeff}#app{min-height:100vh;background:linear-gradient(#9fe7ff 0 58%,#8bd35b 58%);padding:18px;color:#123}.wrap{max-width:1050px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}.title{font-size:28px;font-weight:900}.hud{display:flex;gap:8px;flex-wrap:wrap}.pill,button{border:0;border-radius:12px;padding:9px 13px;font-weight:800;background:white;box-shadow:0 3px 0 #0002}.game{position:relative;height:500px;overflow:hidden;border-radius:20px;border:4px solid #123;background:linear-gradient(#8edfff 0 65%,#70bd4d 65%);box-shadow:0 12px 30px #0002}.sun{position:absolute;right:55px;top:35px;width:70px;height:70px;border-radius:50%;background:#ffd85a}.cloud{position:absolute;width:150px;height:42px;border-radius:50px;background:#fff;top:75px;left:15%;opacity:.85}.cloud:after{content:'';position:absolute;width:65px;height:65px;border-radius:50%;background:#fff;left:38px;top:-28px}.mount{position:absolute;bottom:35%;width:0;height:0;border-left:130px solid transparent;border-right:130px solid transparent;border-bottom:180px solid #65a7a1;opacity:.7}.m1{left:5%}.m2{left:34%;transform:scale(1.3)}.m3{left:68%;transform:scale(.9)}.ground{position:absolute;left:0;right:0;bottom:0;height:35%;background:repeating-linear-gradient(110deg,#75c653 0 12px,#6ab74b 12px 22px)}.player{position:absolute;left:120px;bottom:112px;width:58px;height:82px;z-index:5;transition:bottom .08s}.head{position:relative;width:42px;height:42px;border-radius:50%;background:#ffc79b;border:3px solid #123;margin:auto}.head:before{content:'';position:absolute;right:6px;top:11px;width:5px;height:7px;border-radius:50%;background:#123;box-shadow:-17px 0 0 #123}.head:after{content:'';position:absolute;right:8px;bottom:6px;width:12px;height:6px;border-bottom:2px solid #123;border-radius:50%}.body{width:38px;height:38px;background:#2563eb;border:3px solid #123;border-radius:14px;margin:-1px auto 0}.leg{position:absolute;width:12px;height:30px;background:#123;bottom:-25px;border-radius:8px;transform-origin:top center}.l1{left:13px;transform:rotate(35deg)}.l2{right:13px;transform:rotate(-35deg)}.arm{position:absolute;width:11px;height:28px;background:#ffc79b;border:2px solid #123;border-radius:8px;top:38px;transform-origin:top center}.a1{left:3px;transform:rotate(65deg)}.a2{right:3px;transform:rotate(-65deg)}.running .l1{animation:step1 .18s infinite alternate}.running .l2{animation:step2 .18s infinite alternate}.running .a1{animation:arm1 .18s infinite alternate}.running .a2{animation:arm2 .18s infinite alternate}@keyframes step1{to{transform:rotate(-35deg)}}@keyframes step2{to{transform:rotate(35deg)}}@keyframes arm1{to{transform:rotate(25deg)}}@keyframes arm2{to{transform:rotate(-25deg)}}.ring{position:absolute;bottom:145px;width:30px;height:30px;border:7px solid #ffd33d;border-radius:50%;box-shadow:inset 0 0 0 3px #d99d00;z-index:4}.ob{position:absolute;bottom:105px;width:42px;height:55px;background:#8b5a35;border:4px solid #51351f;border-radius:12px 12px 5px 5px;z-index:4}.ob:before{content:'';position:absolute;left:7px;top:-16px;width:20px;height:20px;background:#8b5a35;border:4px solid #51351f;border-radius:50%}.msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}.msg span{background:#ffffffdc;padding:12px 18px;border-radius:14px;font-weight:900}.controls{display:flex;justify-content:center;gap:10px;margin-top:12px;flex-wrap:wrap}button{cursor:pointer;background:#123;color:white}button:hover{transform:translateY(-1px)}.hint{text-align:center;margin-top:9px;font-size:14px;font-weight:700}
</style></head><body><main id="app"><div class="wrap"><div class="top"><div class="title">🏃 Runner</div><div class="hud"><div class="pill">💍 Anillos: <b id="rings">0</b></div><div class="pill">⭐ Puntos: <b id="score">0</b></div></div></div><div class="game" id="game"><div class="sun"></div><div class="cloud"></div><div class="mount m1"></div><div class="mount m2"></div><div class="mount m3"></div><div class="ground"></div><div class="player" id="player"><div class="head"></div><div class="body"></div><div class="arm a1"></div><div class="arm a2"></div><div class="leg l1"></div><div class="leg l2"></div></div><div class="msg" id="msg"><span>Presiona EMPEZAR</span></div></div><div class="controls"><button id="start">▶ Empezar</button><button id="jump">⬆ Saltar</button><button id="reset">↻ Reiniciar</button></div><div class="hint">El muñeco está mirando y avanzando hacia la derecha. Usa ESPACIO o ↑ para saltar.</div></div></main><script>
const game=document.getElementById('game'),p=document.getElementById('player'),msg=document.getElementById('msg'),ringsEl=document.getElementById('rings'),scoreEl=document.getElementById('score');let run=false,y=0,vy=0,score=0,rings=0,last=0,items=[];function jump(){if(!run)return;if(y===0){vy=820}}function reset(){run=false;y=0;vy=0;score=0;rings=0;items.forEach(x=>x.el.remove());items=[];p.style.bottom='112px';p.classList.remove('running');ringsEl.textContent=0;scoreEl.textContent=0;msg.style.display='flex';msg.innerHTML='<span>Presiona EMPEZAR</span>'}function start(){if(run)return;run=true;p.classList.add('running');msg.style.display='none';last=performance.now();requestAnimationFrame(loop)}function add(type){const el=document.createElement('div');el.className=type==='ring'?'ring':'ob';el.style.left=(game.clientWidth+30)+'px';game.appendChild(el);items.push({el,type,x:game.clientWidth+30,done:false})}function loop(t){if(!run)return;let dt=Math.min((t-last)/1000,.04);last=t;score+=dt*10;scoreEl.textContent=Math.floor(score);vy-=1900*dt;y+=vy*dt;if(y<0){y=0;vy=0}p.style.bottom=(112+y)+'px';if(Math.random()<dt*.7)add('ring');if(Math.random()<dt*.38)add('ob');for(const o of items){o.x-=360*dt;o.el.style.left=o.x+'px';const px=120, py=112+y;const hit=o.x<px+55&&o.x+40>px&&((o.type==='ob'&&py<160)||(o.type==='ring'&&Math.abs((py+35)-(145))<65));if(hit&&!o.done){o.done=true;if(o.type==='ring'){rings++;ringsEl.textContent=rings;o.el.remove()}else{run=false;p.classList.remove('running');y=0;vy=0;score=0;rings=0;ringsEl.textContent=0;scoreEl.textContent=0;msg.style.display='flex';msg.innerHTML='<span>💥 Chocaste. ¡Se reinició la partida!</span>';items.forEach(z=>z.el.remove());items=[];return}}}items=items.filter(o=>o.x>-70&&o.el.isConnected);requestAnimationFrame(loop)}document.getElementById('start').onclick=start;document.getElementById('jump').onclick=jump;document.getElementById('reset').onclick=reset;document.addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='ArrowUp'){e.preventDefault();jump()}if(e.code==='Enter')start()});reset();
</script></body></html>
